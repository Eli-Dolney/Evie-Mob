separateAo = true
oldLighting = false
underwaterOverlay = false
vignette = false
sun = true
moon = true
clouds = fancy

blend.gbuffers_water.colortex2 = off
blend.gbuffers_water.colortex3 = off
blend.gbuffers_clouds.colortex3 = off

program.composite1.enabled = PERF_HUD

# ---------- Profiles (HIGH matches the defaults and is tuned for Apple M-series) ----------
profile.LOW    = shadowMapResolution=1024 shadowDistance=64.0  SHADOW_SAMPLES=4  !SSR SSR_STEPS=12 GODRAY_SAMPLES=6  !WATER_WAVES
profile.MEDIUM = shadowMapResolution=1536 shadowDistance=96.0  SHADOW_SAMPLES=8  SSR  SSR_STEPS=12 GODRAY_SAMPLES=8  WATER_WAVES
profile.HIGH   = shadowMapResolution=2048 shadowDistance=112.0 SHADOW_SAMPLES=8  SSR  SSR_STEPS=20 GODRAY_SAMPLES=12 WATER_WAVES
profile.ULTRA  = shadowMapResolution=3072 shadowDistance=160.0 SHADOW_SAMPLES=12 SSR  SSR_STEPS=28 GODRAY_SAMPLES=16 WATER_WAVES
profile.EXTREME = shadowMapResolution=4096 shadowDistance=192.0 SHADOW_SAMPLES=16 SSR SSR_STEPS=36 GODRAY_SAMPLES=24 WATER_WAVES

# ---------- Menu ----------
screen = <profile> PERF_HUD [COSMOS] [COMIC] [DREAM] [LIGHTING] [SHADOWS] [WATER] [ATMOSPHERE] [POST] HUD_SIZE
screen.COSMOS     = PORTAL PORTAL_STRENGTH PORTAL_SIZE PORTAL_SPIN PLANETS PLANET_SIZE FLOATING_ROCKS ROCK_AMOUNT ROCK_SIZE SKY_HEADS SKY_HEAD_DAYS GIANT_HEAD
screen.COMIC      = INK_OUTLINES INK_STRENGTH INK_WIDTH BLOCK_EDGES NEON_CAVES
screen.DREAM      = DREAM_TINT FOLIAGE_VIBRANCE NIGHT_AURORA AURORA_STRENGTH CLOUD_TINT <empty> CARTOON_CLOUDS CARTOON_CLOUD_AMOUNT CARTOON_CLOUD_HEIGHT CARTOON_OUTLINE CARTOON_CLOUD_SIZE CARTOON_CLOUD_VARIATION CARTOON_CLOUD_STYLE CARTOON_CLOUD_WIND WAVING_PLANTS WAVING_LEAVES WAVE_SPEED WAVE_AMOUNT
screen.LIGHTING   = SUN_BRIGHTNESS AMBIENT_BRIGHTNESS TORCH_BRIGHTNESS TORCH_WARMTH TORCH_FLICKER MIN_LIGHT EMISSIVE_STRENGTH FOLIAGE_SSS ambientOcclusionLevel
screen.SHADOWS    = shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS sunPathRotation
screen.WATER      = WATER_WAVES WATER_WAVE_HEIGHT WATER_OPACITY SSR SSR_STEPS
screen.ATMOSPHERE = FOG_DENSITY BORDER_FOG GODRAYS GODRAY_SAMPLES GODRAY_STRENGTH
screen.POST       = BLOOM BLOOM_STRENGTH EXPOSURE SATURATION VIBRANCE CONTRAST VIGNETTE

sliders = PORTAL_STRENGTH PORTAL_SIZE PORTAL_SPIN PLANET_SIZE ROCK_AMOUNT ROCK_SIZE SKY_HEAD_DAYS INK_STRENGTH INK_WIDTH BLOCK_EDGES \
  DREAM_TINT FOLIAGE_VIBRANCE AURORA_STRENGTH CLOUD_TINT CARTOON_CLOUD_AMOUNT CARTOON_CLOUD_HEIGHT CARTOON_OUTLINE CARTOON_CLOUD_SIZE CARTOON_CLOUD_VARIATION CARTOON_CLOUD_WIND WAVE_SPEED WAVE_AMOUNT \
  SUN_BRIGHTNESS AMBIENT_BRIGHTNESS TORCH_BRIGHTNESS TORCH_WARMTH MIN_LIGHT EMISSIVE_STRENGTH ambientOcclusionLevel \
  shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS sunPathRotation \
  WATER_WAVE_HEIGHT WATER_OPACITY SSR_STEPS FOG_DENSITY GODRAY_SAMPLES GODRAY_STRENGTH \
  BLOOM_STRENGTH EXPOSURE SATURATION VIBRANCE CONTRAST VIGNETTE HUD_SIZE
