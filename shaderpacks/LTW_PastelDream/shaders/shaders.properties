# Pastel Dream - settings layout

screen=<profile> <empty> [LOOK] [LINES]
screen.LOOK=BLOOM_STRENGTH SATURATION FOG_AMOUNT
screen.LINES=OUTLINE_STRENGTH OUTLINE_THICKNESS
sliders=BLOOM_STRENGTH OUTLINE_STRENGTH OUTLINE_THICKNESS SATURATION FOG_AMOUNT

profile.Default=BLOOM_STRENGTH=0.25 OUTLINE_STRENGTH=0.5 OUTLINE_THICKNESS=0.75 SATURATION=1.1 FOG_AMOUNT=0.5
profile.Dreamy=BLOOM_STRENGTH=0.6 OUTLINE_STRENGTH=0.25 OUTLINE_THICKNESS=0.5 SATURATION=1.25 FOG_AMOUNT=0.7
profile.Ink=BLOOM_STRENGTH=0.1 OUTLINE_STRENGTH=1.0 OUTLINE_THICKNESS=1.0 SATURATION=1.1 FOG_AMOUNT=0.3
profile.Performance=BLOOM_STRENGTH=0.0 OUTLINE_STRENGTH=0.0 OUTLINE_THICKNESS=0.75 SATURATION=1.1 FOG_AMOUNT=0.3

# Water mask must overwrite, not blend, so the outline pass can read it cleanly.
blend.gbuffers_water.colortex4=off

clouds=off
oldLighting=false
